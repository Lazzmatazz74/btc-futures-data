name: Fetch extra data (premium, spot, Coinbase, Deribit, CFTC)

# rev1 - companion to fetch_data.yml. Runs 30 min after it, writes ONLY to data/extra/.
# First run backfills from 2020 (expect roughly 30-60 min); later runs take a few minutes.
# The Deribit options snapshot is forward-only, so this must keep running daily.

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily (main data job runs at 02:00)
  workflow_dispatch: {}

concurrency:
  group: data-push          # never run two pushes to the repo at once
  cancel-in-progress: false

jobs:
  update-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run extra collector
        run: python extra_data_downloader_rev1.py

      - name: Commit and push (even if interrupted)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/extra/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new extra data."
          else
            git commit -m "Extra data refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
