name: Live snapshot for brief rev4

# Live market snapshot for the daily brief (levels, volatility, positioning, options, movers).
# Runs at :17 past 00-04 UTC (02:17-06:17 Bratislava) so a fresh snapshot exists before the 07:00 brief
# even when GitHub starts a scheduled run late; also on demand. Writes only data/brief/live/.
# Information only: nothing here trades or blocks a trade.

on:
  schedule:
    - cron: '17 0-4 * * *'
  workflow_dispatch: {}

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            brief/live_snapshot_rev4.py
            data/brief/live/
            data/BTCUSDT-1h.csv
            data/BTCUSDT-1d.csv
            data/ETHUSDT-1h.csv
            data/ETHUSDT-1d.csv
            data/XRPUSDT-1h.csv
            data/XRPUSDT-1d.csv
            data/BNBUSDT-1h.csv
            data/BNBUSDT-1d.csv
            data/LTCUSDT-1h.csv
            data/LTCUSDT-1d.csv
            data/HYPEUSDT-1h.csv
            data/HYPEUSDT-1d.csv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandas / numpy
        run: pip install pandas numpy

      - name: Live snapshot
        run: python brief/live_snapshot_rev4.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brief/live/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Live snapshot rev4: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || { sleep 15; git pull --rebase origin main; }
            git push || { sleep 15; git pull --rebase origin main && git push; }
          fi
