name: Fetch fresh futures data (daily top-up)

# rev2 changes vs rev1:
#   - runs binance_data_downloader_rev5.py (was rev3): now tops up
#     klines + funding + OI/long-short metrics for all 5 symbols,
#     not just BTC/ETH klines.
#   - added a timeout guard.
#
# IMPORTANT: do the INITIAL backfill LOCALLY first (~30-45 min, mostly the
# day-by-day metrics dumps) and commit data/ before enabling the schedule.
# This job is meant only for the fast daily INCREMENTAL top-up. If it runs
# against an empty data/ it will attempt the full backfill inside Actions,
# which is slower and noisier than doing it once on your machine.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily -- a couple hours after UTC midnight,
                          # giving Binance's daily dump pipeline time to publish
                          # the previous day's file
  workflow_dispatch: {}   # manual trigger from the Actions tab, for testing
                          # before trusting the schedule

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # guard; incremental runs finish in a minute or two
    permissions:
      contents: write     # the built-in GITHUB_TOKEN pushes to THIS repo --
                          # no personal access token needed (public or private)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run incremental downloader
        run: python binance_data_downloader_rev5.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data -- nothing to commit."
          else
            git commit -m "Daily data refresh: $(date -u +'%Y-%m-%d')"
            git push
          fi
