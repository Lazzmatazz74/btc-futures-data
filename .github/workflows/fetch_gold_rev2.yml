name: Fetch gold data rev2 (Binance perp + check; Dukascopy mid already in data/gold from rev1)

# Downloads XAU/USD 1m bid + ask from Dukascopy (2016 -> today) with dukascopy-node, merges them to mid
# prices, adds Binance XAUUSDT perp 1m (2026-01 ->) and writes a sanity report.
# Output: data/gold/XAUUSD_1m_mid_<year>.csv.gz, data/gold/XAUUSDT_perp_1m.csv.gz, data/gold/gold_data_check.json
# Script: gold_data_downloader_rev2.py (repo root). Spec: claude-work Trading/SESSION_IFVG_SPEC_rev2.md.
# Manual run only: Actions -> "Fetch gold data rev2" -> Run workflow.

on:
  workflow_dispatch: {}

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          pip install pandas
      - name: Binance perp + check
        if: always()
        run: |
          python gold_data_downloader_rev2.py binance
          python gold_data_downloader_rev2.py check
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gold/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "Gold data rev2: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
