name: Fetch Hyperliquid trader screen (rev2)

# rev2 - adds a "mode" choice: winners (rev1 behaviour) | losers | random (control group).
#   losers/random write to data/hyperliquid/<mode>/ so the winners data is not overwritten.
# Manual run only. Downloads the Hyperliquid leaderboard, a shortlist of candidate
# accounts, and their fills / account-value history / open positions into data/hyperliquid/.
# Expected run time: roughly 30-90 min for 150 accounts (API rate limit is the bottleneck).
# Thresholds can be changed in the "Run workflow" form; blank = script default.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which accounts to download'
        required: true
        default: 'losers'
        type: choice
        options: [losers, random, winners]
      min_alltime_pnl:
        description: 'Min all-time PnL, USD (default 100000)'
        required: false
        default: ''
      min_account_value:
        description: 'Min account value, USD (default 50000)'
        required: false
        default: ''
      max_account_value:
        description: 'Max account value, USD (default 20000000)'
        required: false
        default: ''
      max_vlm_to_acct:
        description: 'Max all-time volume / account value (default 3000)'
        required: false
        default: ''
      shortlist_size:
        description: 'Number of accounts to download (default 150)'
        required: false
        default: ''

concurrency:
  group: data-push          # same group as the other data jobs - never two pushes at once
  cancel-in-progress: false

jobs:
  hyperliquid-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Hyperliquid screen
        env:
          HL_MIN_ALLTIME_PNL: ${{ github.event.inputs.min_alltime_pnl }}
          HL_MIN_ACCOUNT_VALUE: ${{ github.event.inputs.min_account_value }}
          HL_MAX_ACCOUNT_VALUE: ${{ github.event.inputs.max_account_value }}
          HL_MAX_VLM_TO_ACCT: ${{ github.event.inputs.max_vlm_to_acct }}
          HL_SHORTLIST_SIZE: ${{ github.event.inputs.shortlist_size }}
          HL_MODE: ${{ github.event.inputs.mode }}
        run: python hl_trader_screen_rev2.py

      - name: Commit and push (even if interrupted)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hyperliquid/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new Hyperliquid data."
          else
            git commit -m "Hyperliquid screen (${{ github.event.inputs.mode }}): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
