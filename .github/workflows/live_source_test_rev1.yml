name: Live source test rev1 (manual, one-time, writes nothing)

# Tests which live market-data sources a GitHub runner can reach, and when Binance publishes
# its daily archive files (Last-Modified headers, last 14 days). Prints results to the log only:
# no commit, read-only token. Delete or disable after the test.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reachability + archive publish times
        shell: python
        run: |
          import json, time, urllib.request, urllib.error, datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          ms = lambda d: int(d.timestamp() * 1000)
          T = [
            ("binance_fapi_klines", "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1h&limit=2", None),
            ("binance_fapi_premium", "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT", None),
            ("binance_fapi_oi", "https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT", None),
            ("binance_oi_hist", "https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=5m&limit=2", None),
            ("binance_spot", "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=2", None),
            ("binance_spot_mirror", "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=2", None),
            ("bybit_kline", "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=60&limit=2", None),
            ("bybit_tickers", "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT", None),
            ("bybit_oi", "https://api.bybit.com/v5/market/open-interest?category=linear&symbol=BTCUSDT&intervalTime=5min&limit=2", None),
            ("okx_candles", "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=1H&limit=2", None),
            ("okx_funding", "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP", None),
            ("okx_oi", "https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=BTC-USDT-SWAP", None),
            ("bitget_candles", "https://api.bitget.com/api/v2/mix/market/candles?symbol=BTCUSDT&productType=usdt-futures&granularity=1H&limit=2", None),
            ("bitunix_kline", "https://fapi.bitunix.com/api/v1/futures/market/kline?symbol=BTCUSDT&interval=1h&limit=2", None),
            ("bitunix_tickers", "https://fapi.bitunix.com/api/v1/futures/market/tickers?symbols=BTCUSDT", None),
            ("hyperliquid_ctx", "https://api.hyperliquid.xyz/info", {"type": "metaAndAssetCtxs"}),
            ("deribit_dvol", "https://www.deribit.com/api/v2/public/get_volatility_index_data?currency=BTC&resolution=3600"
                             f"&start_timestamp={ms(now - dt.timedelta(hours=3))}&end_timestamp={ms(now)}", None),
            ("deribit_index", "https://www.deribit.com/api/v2/public/get_index_price?index_name=btc_usd", None),
            ("coinbase_candles", "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600", None),
            ("coingecko_ping", "https://api.coingecko.com/api/v3/ping", None),
            ("fed_fomc_calendar", "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm", None),
            ("bls_cpi_schedule", "https://www.bls.gov/schedule/news_release/cpi.htm", None),
          ]
          out = {"run_utc": now.strftime("%Y-%m-%d %H:%M:%S"), "sources": [], "archive": []}
          for name, url, body in T:
              t0 = time.time()
              try:
                  data = json.dumps(body).encode() if body else None
                  req = urllib.request.Request(url, data=data, headers={
                      "User-Agent": "Mozilla/5.0 (live-source-test)",
                      "Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      txt = r.read(400).decode("utf-8", "replace")
                      out["sources"].append({"name": name, "status": r.status,
                          "ms": int((time.time() - t0) * 1000), "head": txt[:300]})
              except urllib.error.HTTPError as e:
                  out["sources"].append({"name": name, "status": e.code, "error": e.read(200).decode("utf-8", "replace")})
              except Exception as e:
                  out["sources"].append({"name": name, "status": None, "error": repr(e)[:200]})
          base = "https://data.binance.vision/data/futures/um/daily"
          for back in range(1, 15):
              d = (now - dt.timedelta(days=back)).strftime("%Y-%m-%d")
              for label, path in [("BTC_5m", f"klines/BTCUSDT/5m/BTCUSDT-5m-{d}.zip"),
                                  ("XRP_5m", f"klines/XRPUSDT/5m/XRPUSDT-5m-{d}.zip"),
                                  ("BTC_metrics", f"metrics/BTCUSDT/BTCUSDT-metrics-{d}.zip")]:
                  try:
                      req = urllib.request.Request(f"{base}/{path}", method="HEAD")
                      with urllib.request.urlopen(req, timeout=20) as r:
                          out["archive"].append({"day": d, "file": label, "status": r.status,
                                                 "last_modified": r.headers.get("Last-Modified")})
                  except urllib.error.HTTPError as e:
                      out["archive"].append({"day": d, "file": label, "status": e.code})
                  except Exception as e:
                      out["archive"].append({"day": d, "file": label, "status": None, "error": repr(e)[:120]})
          print("=====RESULT_JSON_START=====")
          print(json.dumps(out, indent=1))
          print("=====RESULT_JSON_END=====")
